<p-table
  #newsTable
  [value]="items()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [globalFilterFields]="['title', 'description']"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}-{last} of {totalRecords}"
>
  <ng-template #caption>
    <p-iconfield iconPosition="left">
      <p-inputicon>
        <i class="pi pi-search"></i>
      </p-inputicon>
      <input pInputText type="text" placeholder="Title, description" (input)="onSearch($event)" />
    </p-iconfield>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="published_at">
        Published
        <p-sortIcon field="published_at" />
      </th>
      <th pSortableColumn="title">
        Title
        <p-sortIcon field="title" />
      </th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ formatDate(item.published_at) }}</td>
      <td>{{ item.title }}</td>
      <td>
        <span class="news-table-description">{{ item.description }}</span>
      </td>
      <td>
        <div class="table-actions">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [outlined]="true"
            ariaLabel="Edit news"
            (onClick)="onEditClick(item, $event)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [outlined]="true"
            ariaLabel="Delete news"
            (onClick)="onDeleteClick(item, $event)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">No news found.</td>
    </tr>
  </ng-template>
</p-table>
