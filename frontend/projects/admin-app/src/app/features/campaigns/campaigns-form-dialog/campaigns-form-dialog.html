<p-dialog
  [header]="dialogHeader()"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '52rem', maxWidth: '95vw' }"
  styleClass="campaigns-form-dialog"
>
  <form class="campaigns-form-dialog-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="campaigns-form-dialog-columns">
      <div class="campaigns-form-dialog-column">
        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Title<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="title" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Category<span class="campaigns-form-dialog-required">*</span></span
          >
          <p-select
            formControlName="category_id"
            [options]="categoryOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Select category"
            [filter]="true"
            filterBy="label"
            appendTo="body"
          />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Min Days<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="min_days" inputmode="numeric" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Days Count<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="days_count" inputmode="numeric" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Budget<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="budget" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Currency<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="currency" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Min Account<span class="campaigns-form-dialog-required">*</span></span
          >
          <p-select
            formControlName="min_account"
            [options]="accountTypeOptions"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
          />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >Location<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="location" placeholder="PL, DE, FR" />
        </label>
      </div>

      <div class="campaigns-form-dialog-column">
        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >CPM Base<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="cpm_base" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >CPM Min<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="cpm_min" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >CPM Max<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="cpm_max" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >EPC Min<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="epc_min" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >EPC Max<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="epc_max" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >CTR Min<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="ctr_min" inputmode="decimal" />
        </label>

        <label class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label"
            >CTR Max<span class="campaigns-form-dialog-required">*</span></span
          >
          <input pInputText type="text" formControlName="ctr_max" inputmode="decimal" />
        </label>

        <div class="campaigns-form-dialog-field">
          <span class="campaigns-form-dialog-label">Video (MP4)</span>
          <span class="campaigns-form-dialog-video-hint">Upload a file — it is stored on the server (max 15 MB).</span>
          <input
            #videoInput
            class="campaigns-form-dialog-video-input"
            type="file"
            accept="video/mp4,.mp4"
            (change)="onVideoSelected($event)"
          />
          @if (displayVideoUrl(); as videoUrl) {
            <video class="campaigns-form-dialog-video-preview" [attr.src]="videoUrl" controls muted></video>
          } @else {
            <span class="campaigns-form-dialog-video-placeholder">No video</span>
          }
          @if (videoFileName(); as fileName) {
            <span class="campaigns-form-dialog-video-name">{{ fileName }}</span>
          }
          <div class="campaigns-form-dialog-video-actions">
            <p-button
              type="button"
              [label]="isEditMode() && displayVideoUrl() ? 'CHANGE VIDEO' : 'UPLOAD MP4'"
              [outlined]="true"
              (onClick)="videoInput.click()"
            />
            @if (displayVideoUrl()) {
              <p-button
                type="button"
                icon="pi pi-trash"
                severity="danger"
                [outlined]="true"
                ariaLabel="Remove video"
                (onClick)="removeVideo()"
              />
            }
          </div>
        </div>
      </div>
    </div>

    @if (submitError(); as error) {
      <p class="campaigns-form-dialog-error" role="alert">{{ error }}</p>
    }
  </form>

  <ng-template #footer>
    <div class="campaigns-form-dialog-footer">
      <p-button
        type="button"
        label="CANCEL"
        [outlined]="true"
        [disabled]="submitting()"
        (onClick)="closeDialog()"
      />
      <p-button
        type="button"
        [label]="submitLabel()"
        severity="secondary"
        [loading]="submitting()"
        [disabled]="form.invalid || submitting()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>
