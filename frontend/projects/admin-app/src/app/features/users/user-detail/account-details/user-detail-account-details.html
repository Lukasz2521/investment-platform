<div class="user-detail-account-details">
  @if (account()) {
    <div class="user-detail-account-details-control">
      <label for="accountType">Account Type:</label>
      <p-select
        inputId="accountType"
        [options]="accountTypeOptions"
        [(ngModel)]="accountType"
        (ngModelChange)="onAccountTypeChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Select account type"
        [disabled]="saving()"
      />
    </div>

    <div class="user-detail-account-details-control">
      <label for="participation">Participation %:</label>
      <p-iconfield>
        <input
          pInputText
          id="participation"
          type="number"
          min="0"
          max="100"
          step="1"
          [(ngModel)]="participationPercent"
          [disabled]="saving()"
          (blur)="commitParticipation()"
        />
        <p-inputicon>
          <i class="pi pi-pencil"></i>
        </p-inputicon>
      </p-iconfield>
      @if (participationError()) {
        <p class="user-detail-account-details-error">{{ participationError() }}</p>
      }
    </div>

    <div class="user-detail-account-details-control user-detail-account-details-control--toggle">
      <label for="customCampaigns">Custom Campaigns:</label>
      <p-toggleswitch
        inputId="customCampaigns"
        [(ngModel)]="customCampaigns"
        [disabled]="saving()"
        (ngModelChange)="onCustomCampaignsChange($event)"
      />
    </div>

    <div class="user-detail-account-details-control user-detail-account-details-control--toggle">
      <label for="cardPayments">Card Payments:</label>
      <p-toggleswitch
        inputId="cardPayments"
        [(ngModel)]="cardPayments"
        [disabled]="saving()"
        (ngModelChange)="onCardPaymentsChange($event)"
      />
    </div>
  } @else {
    <p>No account</p>
  }
</div>
