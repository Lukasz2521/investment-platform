<section class="user-detail-transactions">
  <p-table
    #transactionsTable
    [value]="transactions()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['type', 'description', 'status']"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}-{last} of {totalRecords}"
  >
    <ng-template #caption>
      <p-iconfield iconPosition="left">
        <p-inputicon>
          <i class="pi pi-search"></i>
        </p-inputicon>
        <input
          pInputText
          type="text"
          placeholder="Type, Description, Status"
          (input)="onSearch($event)"
        />
      </p-iconfield>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="amount">
          Amount
          <p-sortIcon field="amount" />
        </th>
        <th>Currency</th>
        <th pSortableColumn="type">
          Type
          <p-sortIcon field="type" />
        </th>
        <th pSortableColumn="description">
          Description
          <p-sortIcon field="description" />
        </th>
        <th pSortableColumn="status">
          Status
          <p-sortIcon field="status" />
        </th>
        <th pSortableColumn="created_at">
          Created At
          <p-sortIcon field="created_at" />
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-transaction>
      <tr>
        <td>{{ transaction.amount | number: '1.2-2' : 'pl' }}</td>
        <td>€</td>
        <td>{{ transaction.type }}</td>
        <td>{{ transaction.description }}</td>
        <td>
          <span class="user-detail-transactions-status" [attr.data-status]="transaction.status">
            {{ transaction.status }}
          </span>
        </td>
        <td>{{ transaction.created_at | date: 'dd.MM.yyyy, HH:mm:ss' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6">No transactions found.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
