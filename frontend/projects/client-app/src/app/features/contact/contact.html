<section class="contact-page">
  <div class="contact-hero" role="img" [attr.aria-label]="'marketing.contact.heroTagline' | translate">
    <p class="contact-hero-tagline">{{ 'marketing.contact.heroTagline' | translate }}</p>
  </div>

  <div class="contact-inner">
    <header class="contact-header">
      <h1 class="contact-title">{{ 'marketing.contact.title' | translate }}</h1>
      <p class="contact-intro">
        {{ 'marketing.contact.intro' | translate }}
        @if ('marketing.contact.email' | translate; as email) {
          @if (email) {
            <a class="contact-email" [href]="'mailto:' + email">{{ email }}</a>
          }
        }
        {{ 'marketing.contact.introSuffix' | translate }}
      </p>
    </header>

    <form class="contact-form" (submit)="onSubmit($event)" novalidate>
      <div class="contact-row">
        <div class="contact-field">
          <label class="contact-label" for="contact-login">
            {{ 'marketing.contact.login' | translate }}
            <span class="contact-required" aria-hidden="true">*</span>
          </label>
          <input
            id="contact-login"
            class="contact-input"
            type="text"
            name="login"
            autocomplete="username"
            [placeholder]="'marketing.contact.loginPlaceholder' | translate"
            [value]="form().login"
            (input)="updateField('login', $event)"
            required
          />
        </div>

        <div class="contact-field">
          <label class="contact-label" for="contact-phone-number">
            {{ 'marketing.contact.phoneNumber' | translate }}
            <span class="contact-required" aria-hidden="true">*</span>
          </label>
          <input
            id="contact-phone-number"
            class="contact-input"
            type="tel"
            name="phoneNumber"
            autocomplete="tel"
            [placeholder]="'marketing.contact.phoneNumberPlaceholder' | translate"
            [value]="form().phoneNumber"
            (input)="updateField('phoneNumber', $event)"
            required
          />
        </div>
      </div>

      <div class="contact-actions">
        <button class="contact-submit" type="submit">{{ 'marketing.contact.submit' | translate }}</button>
      </div>
    </form>
  </div>
</section>
