<section
  class="consents-step"
  [attr.aria-label]="'app.campaignCreator.consents.ariaLabel' | translate"
>
  <header class="consents-step-header">
    <h2 class="consents-step-title">
      <svg
        class="consents-step-title-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.06 14.54L6.4 11l1.41-1.41 3.13 3.12 6.25-6.25L18.6 8l-7.66 7.54z"
        />
      </svg>
      <span>{{ 'app.campaignCreator.consents.title' | translate }}</span>
    </h2>
    <p class="consents-step-intro">
      {{ 'app.campaignCreator.consents.intro' | translate }}
    </p>
  </header>

  <div class="consents-step-list">
    <label class="consents-step-item">
      <input
        class="consents-step-checkbox"
        type="checkbox"
        [checked]="value().acceptRisk"
        (change)="onToggle('acceptRisk', $event)"
      />
      <div class="consents-step-body">
        <span class="consents-step-label">
          {{ 'app.campaignCreator.consents.risk.label' | translate }}
        </span>
        <ul class="consents-step-bullets">
          @for (item of riskItems; track item) {
            <li>{{ item | translate }}</li>
          }
        </ul>
      </div>
    </label>

    <label class="consents-step-item">
      <input
        class="consents-step-checkbox"
        type="checkbox"
        [checked]="value().confirmData"
        (change)="onToggle('confirmData', $event)"
      />
      <span class="consents-step-label">
        {{ 'app.campaignCreator.consents.confirmData' | translate }}
      </span>
    </label>

    <label class="consents-step-item">
      <input
        class="consents-step-checkbox"
        type="checkbox"
        [checked]="value().acceptNoLiability"
        (change)="onToggle('acceptNoLiability', $event)"
      />
      <span class="consents-step-label">
        {{ 'app.campaignCreator.consents.acceptNoLiability' | translate }}
      </span>
    </label>
  </div>
</section>
