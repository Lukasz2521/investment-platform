<section
  class="campaign-select"
  [attr.aria-label]="'app.campaignCreator.select.ariaLabel' | translate"
>
  <header class="campaign-select-header">
    <h2 class="campaign-select-title">{{ 'app.campaignCreator.select.title' | translate }}</h2>
  </header>

  <app-campaign-card-row [visibleCount]="3">
    @for (campaign of campaigns; track campaign.id) {
      <app-campaign-card
        [campaign]="campaign"
        [selected]="selectedCampaignId() === campaign.id"
        (select)="selectCampaign($event)"
      />
    }
  </app-campaign-card-row>
</section>
