<article class="metric-chart" [attr.aria-label]="title()">
  <header class="metric-chart-header">
    <h2 class="metric-chart-title">{{ title() }}</h2>
    <p class="metric-chart-hero">{{ heroValue() }}</p>
  </header>

  <div class="metric-chart-plot" role="img" [attr.aria-label]="title()">
    <svg class="metric-chart-svg" [attr.viewBox]="viewBox" aria-hidden="true">
      @for (row of gridRows(); track row.label) {
        <line
          class="metric-chart-grid"
          [attr.x1]="pad.left"
          [attr.x2]="width - pad.right"
          [attr.y1]="row.y"
          [attr.y2]="row.y"
        />
        <text
          class="metric-chart-y-label"
          [attr.x]="pad.left - 8"
          [attr.y]="row.y + 4"
          text-anchor="end"
        >
          {{ row.label }}
        </text>
      }

      <path class="metric-chart-line metric-chart-line--previous" [attr.d]="previousPath()" />
      <path class="metric-chart-line metric-chart-line--current" [attr.d]="currentPath()" />

      @for (tick of xTicks(); track tick.label) {
        <text
          class="metric-chart-x-label"
          [attr.x]="tick.x"
          [attr.y]="height - 6"
          text-anchor="middle"
        >
          {{ tick.label }}
        </text>
      }
    </svg>
  </div>

  <footer class="metric-chart-legend">
    <span class="metric-chart-legend-item">
      <span class="metric-chart-dot metric-chart-dot--current" aria-hidden="true"></span>
      {{ currentLegend() }}
    </span>
    <span class="metric-chart-legend-item">
      <span class="metric-chart-dot metric-chart-dot--previous" aria-hidden="true"></span>
      {{ previousLegend() }}
    </span>
  </footer>
</article>
