<div class="login-page">
  <div class="login-card">
    <a class="login-logo" routerLink="/" [attr.aria-label]="'marketing.brand' | translate">
      <img src="/images/logo.svg" alt="" width="332" height="145" />
    </a>

    <header class="login-card-header">
      <h1 class="login-title">{{ 'marketing.login.title' | translate }}</h1>
      <p class="login-subtitle">{{ 'marketing.login.subtitle' | translate }}</p>
    </header>

    <form class="login-form" (submit)="onSubmit($event)" novalidate>
      @if (registrationSuccess()) {
        <p class="login-message login-message--success" role="status">
          {{ 'marketing.login.registrationSuccess' | translate }}
        </p>
      }

      @if (apiError()) {
        <p class="login-message login-message--error" role="alert">
          {{ apiError() }}
        </p>
      }

      <div class="login-field">
        <label class="login-label" for="login-email">{{ 'marketing.login.email' | translate }}</label>
        <input
          id="login-email"
          class="login-input"
          type="email"
          name="email"
          autocomplete="email"
          [value]="email()"
          (input)="onEmailInput($event)"
        />
      </div>

      <div class="login-field">
        <label class="login-label" for="login-password">{{ 'marketing.login.password' | translate }}</label>
        <div class="login-password-wrap">
          <input
            id="login-password"
            class="login-input login-input--password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [value]="password()"
            (input)="onPasswordInput($event)"
          />
          <button
            class="login-password-toggle"
            type="button"
            [attr.aria-label]="
              (showPassword() ? 'marketing.login.hidePassword' : 'marketing.login.showPassword')
                | translate
            "
            [attr.aria-pressed]="showPassword()"
            (click)="togglePasswordVisibility()"
          >
            @if (showPassword()) {
              <svg class="login-password-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.75"
                  d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.5 10.5 0 0 1 12 5c5 0 9.3 3.1 11 7a12.3 12.3 0 0 1-3.3 4.6M6.1 6.1A12.4 12.4 0 0 0 1 12c1.7 3.9 6 7 11 7 1.4 0 2.7-.2 3.9-.7"
                />
              </svg>
            } @else {
              <svg class="login-password-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.75"
                  d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="login-submit" type="submit" [disabled]="loading()">
        {{ (loading() ? 'marketing.login.submitting' : 'marketing.login.submit') | translate }}
      </button>
    </form>

    <p class="login-footer">
      <a class="login-footer-link" [routerLink]="['/', routes.forgotPassword]">
        {{ 'marketing.login.forgotPassword' | translate }}
      </a>
    </p>
  </div>
</div>
