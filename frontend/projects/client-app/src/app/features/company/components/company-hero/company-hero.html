<section class="company-hero">
  <div class="company-hero-inner">
    <div class="company-hero-copy">
      <p class="company-eyebrow">{{ 'marketing.company.hero.eyebrow' | translate }}</p>
      <h1 class="company-hero-title">{{ 'marketing.company.hero.title' | translate }}</h1>
      <p class="company-hero-lead">{{ 'marketing.company.hero.lead' | translate }}</p>
      <p class="company-hero-text">{{ 'marketing.company.hero.paragraph1' | translate }}</p>
      <p class="company-hero-text">{{ 'marketing.company.hero.paragraph2' | translate }}</p>
    </div>
    <div class="company-hero-visual">
      <img
        src="/images/company/intro.jpg"
        [alt]="'marketing.company.hero.imageAlt' | translate"
        loading="eager"
        decoding="async"
      />
    </div>
  </div>
</section>
