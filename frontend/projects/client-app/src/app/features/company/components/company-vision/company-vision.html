<section class="company-vision">
  <div class="company-vision-inner">
    <div class="company-vision-visual">
      <img
        src="/images/company/vision.jpg"
        [alt]="'marketing.company.vision.imageAlt' | translate"
        loading="lazy"
        decoding="async"
      />
    </div>
    <div class="company-vision-copy">
      <h2 class="company-section-title">{{ 'marketing.company.vision.title' | translate }}</h2>
      <p class="company-vision-text">{{ 'marketing.company.vision.paragraph1' | translate }}</p>
      <p class="company-vision-text">{{ 'marketing.company.vision.paragraph2' | translate }}</p>
    </div>
  </div>
</section>
