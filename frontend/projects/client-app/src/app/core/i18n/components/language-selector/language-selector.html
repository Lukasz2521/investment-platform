@if (variant() === 'compact') {
  <div class="language-selector language-selector--compact">
    <button
      class="language-selector-trigger"
      type="button"
      [attr.aria-label]="'language.label' | translate"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="language-selector-flag" aria-hidden="true">{{ activeFlag }}</span>
      <span class="language-selector-chevron" aria-hidden="true"></span>
    </button>

    @if (menuOpen()) {
      <button class="language-selector-backdrop" type="button" tabindex="-1" (click)="closeMenu()"></button>
      <ul class="language-selector-menu" role="listbox">
        @for (language of languages; track language.code) {
          <li>
            <button
              class="language-selector-option"
              type="button"
              role="option"
              [attr.aria-selected]="language.code === activeLanguage()"
              (click)="selectLanguage(language.code)"
            >
              <span aria-hidden="true">{{ language.flag }}</span>
              <span>{{ language.label }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
} @else {
  <label class="language-selector">
    <span class="language-selector-label">{{ 'language.label' | translate }}</span>
    <select
      class="language-selector-control"
      [value]="activeLanguage()"
      (change)="onLanguageChange($event)"
    >
      @for (language of languages; track language.code) {
        <option [value]="language.code">{{ language.label }}</option>
      }
    </select>
  </label>
}
